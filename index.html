<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog UMKM & Kasir</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Katalog Produk UMKM</h1>
    <main class="flex flex-col md:flex-row gap-6 p-6 max-w-7xl mx-auto">
      <section class="w-full md:w-2/3">
        <input
          class="w-full max-w-md mx-auto block mb-6 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          type="text"
          id="searchInput"
          placeholder="Cari menu kopi..."
        />
        <div class="container p-4 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </section>
      <aside
        id="cartContainer"
        class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-md h-fit"
      >
        <span id="totalPrice">Rp 0</span>
      </aside>
    </main>

    <!-- Script Js -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
